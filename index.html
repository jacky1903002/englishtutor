<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enterprise Vocab Pro - Duolingo 旗艦雲端版</title>
  
  <!-- PWA 外部 Manifest 宣告 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#58cc02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --duo-green: #58cc02;
      --duo-green-shadow: #46a302;
      --duo-blue: #1cb0f6;
      --duo-blue-shadow: #1899d6;
      --duo-orange: #ff9600;
      --duo-orange-shadow: #e58600;
      --duo-yellow: #ffc800;
      --duo-red: #ff4b4b;
      --duo-red-shadow: #ea2b2b;
      --duo-gray: #e5e5e5;
      --duo-dark-gray: #afafaf;
      --text-dark: #4b4b4b;
      --bg-main: #f7f9fa;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Din Round', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* 只有在「電腦螢幕 (寬度大於 768px)」且「非 PWA 獨立 App 模式」下，才限制手機模擬寬度 */
    @media (min-width: 768px) {
      body.mobile-mode main {
        max-width: 420px !important;
        margin: 24px auto;
        background: var(--card-bg);
        border: 2px solid var(--duo-gray);
        border-radius: 28px;
        padding: 24px;
        box-shadow: 0 12px 0 var(--duo-gray);
      }
    }

    /* 如果是以手機桌面 PWA 獨立 App 模式開啟，強制滿版，絕不出現模擬框框或邊框 */
    @media all and (display-mode: standalone), all and (display-mode: fullscreen) {
      body.mobile-mode main {
        max-width: 100% !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 auto !important;
        padding: 0 16px !important;
        background: var(--bg-main) !important;
      }
    }

    header {
      background: white;
      border-bottom: 2px solid var(--duo-gray);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.3rem; font-weight: 900; color: var(--duo-green); display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
    
    .status-bar { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1rem; }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .xp { color: var(--duo-yellow); }

    main { max-width: 900px; width: 100%; margin: 24px auto; padding: 0 16px; flex: 1; transition: all 0.3s ease; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
    .tab-btn {
      background: white;
      border: 2px solid var(--duo-gray);
      border-bottom: 5px solid var(--duo-dark-gray);
      color: #777;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .tab-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    .tab-btn.active {
      background: var(--duo-blue);
      color: white;
      border-color: var(--duo-blue-shadow);
      box-shadow: 0 4px 0 var(--duo-blue-shadow);
    }

    .card { background: var(--card-bg); border: 2px solid var(--duo-gray); border-radius: 24px; padding: 24px; box-shadow: 0 8px 0 var(--duo-gray); margin-bottom: 24px; position: relative; }

    .view { display: none; }
    .view.active { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .btn-3d {
      background: var(--duo-green);
      color: white;
      border: none;
      border-bottom: 5px solid var(--duo-green-shadow);
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-3d:hover { filter: brightness(1.05); }
    .btn-3d:active { transform: translateY(3px); border-bottom-width: 2px; }

    .btn-secondary-3d {
      background: white;
      color: var(--duo-blue);
      border: 2px solid var(--duo-gray);
      border-bottom: 5px solid var(--duo-dark-gray);
    }
    .btn-secondary-3d:hover { background: #f8fafc; }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .achievement-badge {
      background: #f8fafc;
      border: 2px solid var(--duo-gray);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .achievement-badge.locked { filter: grayscale(1); opacity: 0.5; background: #eee; }
    .achievement-badge:not(.locked) {
      border-color: var(--duo-yellow);
      box-shadow: 0 6px 0 rgba(255, 200, 0, 0.3);
      background: linear-gradient(135deg, #fffdf4 0%, #fff 100%);
    }
    .badge-icon-box {
      width: 56px; height: 56px; border-radius: 50%; background: white;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
      border: 3px solid var(--duo-gray); box-shadow: 0 4px 0 var(--duo-gray); margin-bottom: 4px;
    }
    .achievement-badge:not(.locked) .badge-icon-box {
      border-color: var(--duo-yellow); background: var(--duo-yellow); color: white; box-shadow: 0 4px 0 #e5b200;
    }
    .badge-title { font-size: 1rem; font-weight: 900; color: #3c3c3c; }
    .badge-desc { font-size: 0.8rem; font-weight: 700; color: #777; }

    .progress-bar-wrap { width: 100%; height: 14px; background: var(--duo-gray); border-radius: 10px; overflow: hidden; margin: 16px 0; }
    .progress-bar-fill { height: 100%; background: var(--duo-green); width: 0%; transition: width 0.3s ease; border-radius: 10px; }

    .hero-card-viewport {
      background: white; border: 3px solid var(--duo-gray); border-radius: 24px; padding: 24px;
      min-height: 320px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 8px 0 var(--duo-gray);
    }
    .hero-word-header { display: flex; justify-content: space-between; align-items: center; }
    .hero-word-title { font-size: 2.6rem; font-weight: 900; color: #3c3c3c; }
    .hero-word-meaning { font-size: 1.5rem; color: var(--duo-blue); font-weight: 800; margin-top: 6px; }
    
    .audio-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--duo-blue); color: white;
      border: none; border-bottom: 4px solid var(--duo-blue-shadow); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer;
    }
    .audio-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

    .hero-example-box { background: #f1f5f9; border-left: 6px solid var(--duo-yellow); padding: 16px; border-radius: 14px; margin-top: 20px; }

    .dots-container { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
    .dot {
      width: 32px; height: 32px; border-radius: 10px; background: white; border: 2px solid var(--duo-gray);
      border-bottom: 4px solid var(--duo-dark-gray); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #888; cursor: pointer; font-size: 0.9rem;
    }
    .dot.active { background: var(--duo-green); color: white; border-color: var(--duo-green-shadow); }

    .quiz-word-display { font-size: 2.4rem; font-weight: 900; color: #3c3c3c; text-align: center; margin: 16px 0; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 16px; }
    
    .option-btn {
      background: white; border: 2px solid var(--duo-gray); border-bottom: 5px solid var(--duo-dark-gray);
      padding: 16px 20px; border-radius: 16px; color: #3c3c3c; font-size: 1.05rem; font-weight: 800; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    }
    .option-btn:hover { background: #f7f9fa; border-color: var(--duo-blue); }
    .option-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    
    .option-btn.correct { background: #d7ffb8 !important; border-color: var(--duo-green) !important; color: #2e7d32 !important; }
    .option-btn.wrong { background: #ffdfe0 !important; border-color: var(--duo-red) !important; color: #c62828 !important; }

    .feedback-footer {
      position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px 24px;
      display: flex; justify-content: space-between; align-items: center; z-index: 200;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .feedback-footer.show { transform: translateY(0); }
    .feedback-footer.correct-bg { background: #d7ffb8; border-top: 3px solid var(--duo-green); color: #2e7d32; }
    .feedback-footer.wrong-bg { background: #ffdfe0; border-top: 3px solid var(--duo-red); color: #c62828; }

    .input-field {
      width: 100%; max-width: 320px; padding: 12px 16px; border: 2px solid var(--duo-gray);
      border-radius: 16px; font-size: 1rem; font-weight: 800; outline: none; margin: 8px 0;
    }
    .input-field:focus { border-color: var(--duo-blue); }

    #auth-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .auth-box {
      background: white; padding: 32px; border-radius: 24px; width: 400px; max-width: 90%;
      border: 3px solid var(--duo-gray); box-shadow: 0 10px 0 var(--duo-gray); text-align: center;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.95rem; }
    th, td { padding: 12px; border-bottom: 2px solid var(--duo-gray); text-align: left; font-weight: 700; }
    th { color: #888; background: #f8fafc; }
  </style>
</head>
<body>

  <!-- 登入與註冊 Modal -->
  <div id="auth-modal">
    <div class="auth-box">
      <div style="font-size: 2.8rem; color: var(--duo-green); margin-bottom: 10px;"><i class="fa-solid fa-feather-pointed"></i></div>
      <h2 id="auth-title" style="font-size: 1.5rem; font-weight: 900; margin-bottom: 14px;">歡迎登入 Enterprise Vocab</h2>
      
      <div id="auth-form-container" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div id="nickname-group" style="display: none; width: 100%;">
          <input type="text" id="auth-nickname" class="input-field" placeholder="請輸入您的遊戲暱稱" style="max-width: 100%;">
        </div>
        <input type="email" id="auth-email" class="input-field" placeholder="電子郵件 (Email)" style="max-width: 100%;">
        <input type="password" id="auth-password" class="input-field" placeholder="密碼 (Password)" style="max-width: 100%;">

        <button class="btn-3d" id="auth-submit-btn" onclick="handleAuthSubmit()" style="width: 100%; margin-top: 8px;">登入系統</button>
        
        <p id="auth-switch-text" style="margin-top: 14px; font-weight: 700; font-size: 0.9rem; color: #777; cursor: pointer;" onclick="toggleAuthMode()">
          還沒有帳號？點此免費註冊
        </p>
      </div>
    </div>
  </div>

  <!-- 頂部狀態列 -->
  <header>
    <div class="logo"><i class="fa-solid fa-feather-pointed"></i> Vocab Pro</div>
    <div class="status-bar">
      <!-- 版面切換按鈕 -->
      <button class="btn-3d btn-secondary-3d" id="layout-toggle-btn" onclick="toggleLayoutMode()" style="padding: 6px 10px; font-size: 0.8rem;" title="切換網頁/手機版">
        <i class="fa-solid fa-mobile-screen"></i> <span id="layout-btn-text">手機板</span>
      </button>
      <div class="status-item" style="color: var(--duo-blue); font-size: 0.9rem;"><i class="fa-solid fa-user"></i> <span id="current-user-tag">未登入</span></div>
      <div class="status-item xp" title="總經驗值"><i class="fa-solid fa-bolt"></i> <span id="xp-count">0 XP</span></div>
      <button class="btn-3d btn-secondary-3d" style="padding: 6px 10px; font-size: 0.8rem;" onclick="handleLogout()">登出</button>
    </div>
  </header>

  <main>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('study')"><i class="fa-solid fa-book-open"></i> 學習</button>
      <button class="tab-btn" onclick="switchTab('quiz')"><i class="fa-solid fa-gamepad"></i> 測驗</button>
      <button class="tab-btn" onclick="switchTab('badges')"><i class="fa-solid fa-award"></i> 徽章</button>
      <button class="tab-btn" onclick="switchTab('enterprise')"><i class="fa-solid fa-trophy"></i> 排行</button>
      <button class="tab-btn" onclick="switchTab('database')"><i class="fa-solid fa-list-check"></i> 單字庫</button>
    </div>

    <!-- 1. 卡牌學習區 -->
    <div id="view-study" class="view active">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
        <div>
          <h2 style="font-size: 1.3rem; font-weight: 900;">🎯 每日單字特訓</h2>
          <p style="color: #888; font-size: 0.9rem; font-weight: 700;">點擊喇叭發音，下方可切換卡牌。</p>
        </div>
        <button class="btn-3d" onclick="loadStudyCards()" style="padding: 10px 16px; font-size: 0.95rem;"><i class="fa-solid fa-shuffle"></i> 換一批</button>
      </div>

      <div id="hero-card-container"></div>
      <div class="dots-container" id="pagination-dots"></div>

      <div style="display: flex; justify-content: space-between; margin-top: 16px;">
        <button class="btn-3d btn-secondary-3d" onclick="changeCardIndex(-1)" style="padding: 10px 16px; font-size: 0.95rem;"><i class="fa-solid fa-arrow-left"></i> 上一張</button>
        <button class="btn-3d btn-secondary-3d" onclick="changeCardIndex(1)" style="padding: 10px 16px; font-size: 0.95rem;">下一張 <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- 2. 闖關測驗區 -->
    <div id="view-quiz" class="view">
      <div class="card">
        <div id="quiz-start-screen" style="text-align: center; padding: 20px 0;">
          <div style="font-size: 3.5rem; color: var(--duo-green); margin-bottom: 16px;"><i class="fa-solid fa-circle-play"></i></div>
          <h2 style="font-size: 1.6rem; font-weight: 900; margin-bottom: 8px;">準備好開始挑戰了嗎？</h2>
          <p style="color: #777; font-size: 0.95rem; font-weight: 700; margin-bottom: 16px;">答題後自動倒數 3 秒進入下一題：</p>
          <button class="btn-3d" onclick="startQuiz()" style="font-size: 1.1rem; width: 80%; max-width: 260px;"><i class="fa-solid fa-rocket"></i> 開始測驗</button>
        </div>

        <div id="quiz-question-screen" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: #888;">
            <span id="quiz-progress-text">題目 1 / 10</span>
            <span style="color: var(--duo-orange);" id="quiz-lvl-badge">Level 1</span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="quiz-progress-fill"></div>
          </div>

          <div style="display: flex; justify-content: center; align-items: center; gap: 12px;">
            <div class="quiz-word-display" id="quiz-word-el">Loading...</div>
            <button class="audio-btn" onclick="speakCurrentWord()"><i class="fa-solid fa-volume-high"></i></button>
          </div>

          <div class="options-grid" id="quiz-options-container"></div>
        </div>

        <div id="quiz-result-screen" style="display: none; text-align: center; padding: 20px 0;">
          <div style="font-size: 4.5rem; color: var(--duo-yellow); margin-bottom: 16px;"><i class="fa-solid fa-crown"></i></div>
          <h2 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 8px;">關卡完成並已同步至雲端！</h2>
          <p id="quiz-score-display" style="font-size: 1.2rem; font-weight: 800; color: #3c3c3c; margin-bottom: 20px;"></p>
          <button class="btn-3d" onclick="resetQuiz()"><i class="fa-solid fa-rotate-right"></i> 再玩一次</button>
        </div>
      </div>
    </div>

    <!-- 3. 成就徽章牆區 -->
    <div id="view-badges" class="view">
      <div class="card">
        <h2 style="font-size: 1.3rem; font-weight: 900; margin-bottom: 6px;"><i class="fa-solid fa-award" style="color: var(--duo-yellow);"></i> 個人成就徽章牆</h2>
        <p style="color: #777; font-size: 0.9rem; font-weight: 700; margin-bottom: 16px;">解鎖連續登入與完美通關的至高榮譽！</p>

        <h3 style="font-size: 1.05rem; font-weight: 900; margin-bottom: 10px; color: var(--text-dark);">🔥 長期連續登入徽章</h3>
        <div class="badge-grid" id="login-badges-container"></div>

        <h3 style="font-size: 1.05rem; font-weight: 900; margin: 20px 0 10px 0; color: var(--text-dark);">👑 完美通關累積徽章</h3>
        <div class="badge-grid" id="perfect-badges-container"></div>
      </div>
    </div>

    <!-- 4. 戰情排行榜 -->
    <div id="view-enterprise" class="view">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 style="font-size: 1.3rem; font-weight: 900;"><i class="fa-solid fa-medal" style="color: var(--duo-yellow);"></i> 雲端戰情排行榜</h2>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>玩家</th>
                <th>等級</th>
                <th>得分</th>
                <th>正確率</th>
                <th>時間</th>
              </tr>
            </thead>
            <tbody id="enterprise-history-tbody">
              <tr><td colspan="5" style="text-align: center; color: #888;">載入雲端排行榜中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 5. 單字庫完整檢索 -->
    <div id="view-database" class="view">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
          <h3 style="font-size: 1.2rem; font-weight: 900;">📚 單字庫檢索 (<span id="db-count-label">0</span>)</h3>
          <input type="text" id="db-search-input" placeholder="搜尋單字..." oninput="renderDatabase()" class="input-field" style="margin: 0; max-width: 180px;">
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>單字</th>
                <th>釋義</th>
                <th>等級</th>
                <th>例句</th>
              </tr>
            </thead>
            <tbody id="db-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="feedback-footer" id="feedback-footer">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="font-size: 2.2rem;" id="feedback-icon"><i class="fa-solid fa-circle-check"></i></div>
      <div>
        <h3 id="feedback-title" style="font-size: 1.2rem; font-weight: 900;">太棒了！</h3>
        <p id="feedback-detail" style="font-size: 0.9rem; font-weight: 700;"></p>
      </div>
    </div>
    <div id="countdown-timer-text" style="font-size: 1.1rem; font-weight: 900;">3 秒後自動下一題...</div>
  </div>

  <!-- Firebase 核心及應用程式邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDjBHf2C07wTyZjLC5ek1pIStEZBTrMCQc",
      authDomain: "englishtutor-2505f.firebaseapp.com",
      databaseURL: "https://englishtutor-2505f-default-rtdb.firebaseio.com",
      projectId: "englishtutor-2505f",
      storageBucket: "englishtutor-2505f.firebasestorage.app",
      messagingSenderId: "372456895281",
      appId: "1:372456895281:web:f47bf92e3e1495e5fcb610",
      measurementId: "G-E7DJB640V5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let masterVocabDB = [];
    let currentStudyPool = [];
    let currentCardIndex = 0;
    let currentUserProfile = { uid: '', email: '', nickname: '未命名', xp: 0, loginDays: 1, perfectCount: 0 };
    let isRegisterMode = false;
    let countdownTimer = null;

    // 註冊正式的 Service Worker (sw.js) 支援手機 PWA 安裝
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
      });
    }

    // 版面切換邏輯 (網頁版 / 手機版)
    let isMobileView = localStorage.getItem('ox_ind_mobile_view') === 'true';
    applyLayoutMode();

    window.toggleLayoutMode = function() {
      isMobileView = !isMobileView;
      localStorage.setItem('ox_ind_mobile_view', isMobileView);
      applyLayoutMode();
    };

    function applyLayoutMode() {
      const btnText = document.getElementById('layout-btn-text');
      if (isMobileView) {
        document.body.classList.add('mobile-mode');
        if (btnText) btnText.innerText = '網頁版';
      } else {
        document.body.classList.remove('mobile-mode');
        if (btnText) btnText.innerText = '手機板';
      }
    }

    window.toggleAuthMode = function() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? '註冊新帳號' : '歡迎登入 Enterprise Vocab';
      document.getElementById('nickname-group').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? '立即註冊並登入' : '登入系統';
      document.getElementById('auth-switch-text').innerText = isRegisterMode ? '已有帳號？點此直接登入' : '還沒有帳號？點此免費註冊';
    };

    window.handleAuthSubmit = function() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const nickname = document.getElementById('auth-nickname').value.trim();

      if (!email || !password) {
        alert("請填寫完整的電子郵件與密碼！");
        return;
      }

      if (isRegisterMode) {
        if (!nickname) {
          alert("註冊時請輸入您的遊戲暱稱！");
          return;
        }
        createUserWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            const user = userCredential.user;
            set(ref(db, 'users/' + user.uid), {
              nickname: nickname,
              email: email,
              xp: 0,
              loginDays: 1,
              perfectCount: 0,
              lastLoginDate: new Date().toDateString()
            });
          })
          .catch((error) => { alert("註冊失敗：" + error.message); });
      } else {
        signInWithEmailAndPassword(auth, email, password)
          .catch((error) => { alert("登入失敗：" + error.message); });
      }
    };

    window.handleLogout = function() {
      signOut(auth).then(() => { location.reload(); });
    };

    onAuthStateChanged(auth, (user) => {
      const modal = document.getElementById('auth-modal');
      if (user) {
        modal.style.display = 'none';
        const userRef = ref(db, 'users/' + user.uid);
        onValue(userRef, (snapshot) => {
          const data = snapshot.val();
          currentUserProfile.uid = user.uid;
          currentUserProfile.email = user.email;
          
          const todayStr = new Date().toDateString();
          let loginDays = data?.loginDays || 1;
          let lastLogin = data?.lastLoginDate || "";

          if (lastLogin !== todayStr) {
            const lastDateObj = new Date(lastLogin);
            const todayObj = new Date(todayStr);
            const diffTime = todayObj - lastDateObj;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) {
              loginDays += 1;
            } else if (diffDays > 1) {
              loginDays = 1;
            }
            update(userRef, { loginDays: loginDays, lastLoginDate: todayStr });
          }

          currentUserProfile.nickname = data?.nickname || user.email.split('@')[0];
          currentUserProfile.xp = data?.xp || 0;
          currentUserProfile.loginDays = loginDays;
          currentUserProfile.perfectCount = data?.perfectCount || 0;

          document.getElementById('current-user-tag').innerText = currentUserProfile.nickname;
          document.getElementById('xp-count').innerText = currentUserProfile.xp + " XP";
          
          renderBadges();
        }, { onlyOnce: true });

        initDatabase();
      } else {
        modal.style.display = 'flex';
      }
    });

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }
    window.speakWord = speakWord;

    async function initDatabase() {
      try {
        const response = await fetch('./vocab_7000.json');
        if (!response.ok) throw new Error("JSON not found");
        const rawData = await response.json();
        
        masterVocabDB = rawData.map((item, index) => ({
          key: (item.word || item.vocab || String(index)) + "_" + index,
          word: item.word || item.vocab || "",
          meaning: (item.pos ? `[${item.pos}] ` : '') + (item.translation || item.meaning || item.definition || ''),
          level: item.level || item.lvl || 1,
          exampleEn: item.sentence || item.exampleEn || item.en || "",
          exampleZh: item.sentence_zh || item.exampleZh || item.zh || ""
        }));
      } catch (err) {
        console.error("載入 vocab_7000.json 失敗：", err);
        masterVocabDB = [
          { word: "ability", meaning: "[n.] 能力、才能", level: 1, exampleEn: "She has the ability to lead.", exampleZh: "她具備領導能力。" },
          { word: "efficiency", meaning: "[n.] 效率、效能", level: 1, exampleEn: "Improve manufacturing efficiency.", exampleZh: "提升製造效率。" },
          { word: "precision", meaning: "[n.] 精密度", level: 2, exampleEn: "CNC machining requires precision.", exampleZh: "CNC 加工需要精密度。" }
        ];
      }

      document.getElementById('db-count-label').innerText = masterVocabDB.length;
      loadStudyCards();
      renderDatabase();
      listenEnterpriseHistory();
    }

    window.switchTab = function(tabId) {
      ['study', 'quiz', 'badges', 'enterprise', 'database'].forEach((id, idx) => {
        document.getElementById(`view-${id}`).classList.toggle('active', id === tabId);
        document.querySelectorAll('.tab-btn')[idx].classList.toggle('active', id === tabId);
      });
      if (tabId === 'study') loadStudyCards();
      if (tabId === 'badges') renderBadges();
      if (tabId === 'database') renderDatabase();
    };

    function getRandomItems(arr, count) {
      return [...arr].sort(() => 0.5 - Math.random()).slice(0, count);
    }

    window.loadStudyCards = function() {
      if (masterVocabDB.length === 0) return;
      currentStudyPool = getRandomItems(masterVocabDB, Math.min(10, masterVocabDB.length));
      currentCardIndex = 0;
      renderStudyCard();
    };

    function renderStudyCard() {
      if (currentStudyPool.length === 0) return;
      const item = currentStudyPool[currentCardIndex];
      const container = document.getElementById('hero-card-container');

      container.innerHTML = `
        <div class="hero-card-viewport">
          <div>
            <div class="hero-word-header">
              <span class="hero-word-title">${item.word}</span>
              <button class="audio-btn" onclick="speakWord('${item.word}')"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            <div class="hero-word-meaning">${item.meaning}</div>
          </div>
          <div class="hero-example-box">
            <div style="font-weight: 800; font-size: 1.05rem; color: #3c3c3c;">"${item.exampleEn || 'No example.'}"</div>
            <div style="color: #777; font-weight: 700; margin-top: 4px; font-size: 0.9rem;">"${item.exampleZh || '暫無例句中文'}"</div>
          </div>
        </div>
      `;

      const dotsContainer = document.getElementById('pagination-dots');
      dotsContainer.innerHTML = '';
      currentStudyPool.forEach((_, idx) => {
        dotsContainer.innerHTML += `<div class="dot ${idx === currentCardIndex ? 'active' : ''}" onclick="goToCard(${idx})">${idx + 1}</div>`;
      });
    }

    window.changeCardIndex = function(delta) {
      const newIndex = currentCardIndex + delta;
      if (newIndex >= 0 && newIndex < currentStudyPool.length) {
        currentCardIndex = newIndex;
        renderStudyCard();
      }
    };

    window.goToCard = function(index) {
      currentCardIndex = index;
      renderStudyCard();
    };

    /* 闖關測驗邏輯 */
    let quizQuestions = [];
    let currentQIdx = 0;
    let currentScore = 0;

    window.startQuiz = function() {
      quizQuestions = getRandomItems(masterVocabDB, Math.min(10, masterVocabDB.length));
      currentQIdx = 0;
      currentScore = 0;

      document.getElementById('quiz-start-screen').style.display = 'none';
      document.getElementById('quiz-result-screen').style.display = 'none';
      document.getElementById('quiz-question-screen').style.display = 'block';
      renderQuizQuestion();
    };

    function renderQuizQuestion() {
      if (currentQIdx >= quizQuestions.length) {
        finishQuiz();
        return;
      }

      const q = quizQuestions[currentQIdx];
      document.getElementById('quiz-progress-text').innerText = `題目 ${currentQIdx + 1} / ${quizQuestions.length}`;
      document.getElementById('quiz-progress-fill').style.width = `${((currentQIdx + 1) / quizQuestions.length) * 100}%`;
      document.getElementById('quiz-word-el').innerText = q.word;

      speakWord(q.word);

      const wrongPool = masterVocabDB.filter(item => item.word !== q.word);
      const wrongs = getRandomItems(wrongPool, 3);
      const options = getRandomItems([q, ...wrongs], 4);

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';
      options.forEach((opt, idx) => {
        container.innerHTML += `
          <button class="option-btn" onclick="checkAnswer(this, '${opt.meaning.replace(/'/g, "\\'")}', '${q.meaning.replace(/'/g, "\\'")}')">
            <span>(${idx + 1}) ${opt.meaning}</span>
            <i class="fa-regular fa-circle"></i>
          </button>
        `;
      });
    }

    window.speakCurrentWord = function() {
      const q = quizQuestions[currentQIdx];
      if (q) speakWord(q.word);
    };

    window.checkAnswer = function(btn, selected, correct) {
      const isCorrect = selected === correct;
      document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');

      if (isCorrect) {
        btn.classList.add('correct');
        btn.querySelector('i').className = 'fa-solid fa-circle-check';
        currentScore++;
        showFeedback(true, "答對了！太厲害了！");
      } else {
        btn.classList.add('wrong');
        btn.querySelector('i').className = 'fa-solid fa-circle-xmark';
        showFeedback(false, `正確答案是：${correct}`);
      }

      let timeLeft = 3;
      const timerText = document.getElementById('countdown-timer-text');
      timerText.innerText = `${timeLeft} 秒後自動下一題...`;

      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerText.innerText = `${timeLeft} 秒後自動下一題...`;
        } else {
          clearInterval(countdownTimer);
          nextQuizQuestion();
        }
      }, 1000);
    };

    function showFeedback(isCorrect, text) {
      const footer = document.getElementById('feedback-footer');
      footer.className = `feedback-footer show ${isCorrect ? 'correct-bg' : 'wrong-bg'}`;
      document.getElementById('feedback-icon').innerHTML = isCorrect ? `<i class="fa-solid fa-circle-check"></i>` : `<i class="fa-solid fa-circle-xmark"></i>`;
      document.getElementById('feedback-title').innerText = isCorrect ? "非常好！" : "再接再厲！";
      document.getElementById('feedback-detail').innerText = text;
    }

    function nextQuizQuestion() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('feedback-footer').classList.remove('show');
      currentQIdx++;
      renderQuizQuestion();
    }

    function finishQuiz() {
      document.getElementById('quiz-question-screen').style.display = 'none';
      document.getElementById('quiz-result-screen').style.display = 'block';

      const totalQ = quizQuestions.length;
      const pct = Math.round((currentScore / totalQ) * 100);
      document.getElementById('quiz-score-display').innerText = `${currentUserProfile.nickname} 獲得得分：${currentScore} / ${totalQ} (${pct}%)`;

      const earnedXP = currentScore * 10;
      currentUserProfile.xp += earnedXP;
      document.getElementById('xp-count').innerText = currentUserProfile.xp + " XP";

      if (currentScore === totalQ) {
        currentUserProfile.perfectCount += 1;
      }

      update(ref(db, 'users/' + currentUserProfile.uid), {
        xp: currentUserProfile.xp,
        perfectCount: currentUserProfile.perfectCount
      });

      push(ref(db, 'quiz_history'), {
        user: currentUserProfile.nickname,
        date: new Date().toLocaleString(),
        score: `${currentScore}/${totalQ}`,
        pct: pct,
        level: 1,
        timestamp: Date.now()
      });
    }

    window.resetQuiz = function() {
      document.getElementById('quiz-result-screen').style.display = 'none';
      document.getElementById('quiz-start-screen').style.display = 'block';
    };

    // 渲染成就徽章牆
    function renderBadges() {
      const loginDays = currentUserProfile.loginDays || 1;
      const perfectCount = currentUserProfile.perfectCount || 0;

      const loginBadgesConfig = [
        { days: 1, title: "初學幼苗", desc: "完成首次登入體驗", icon: "fa-seedling" },
        { days: 3, title: "持續發芽", desc: "連續登入達 3 天", icon: "fa-spa" },
        { days: 7, title: "熱情火焰", desc: "連續登入達 7 天", icon: "fa-fire" },
        { days: 14, title: "閃耀鑽石", desc: "連續登入達 14 天", icon: "fa-gem" },
        { days: 30, title: "月度菁英", desc: "連續登入滿 30 天", icon: "fa-calendar-check" },
        { days: 100, title: "百日維新", desc: "連續登入滿 100 天", icon: "fa-medal" },
        { days: 300, title: "年度淬鍊", desc: "連續登入滿 300 天", icon: "fa-award" },
        { days: 500, title: "半千大師", desc: "連續登入滿 500 天", icon: "fa-shield-halved" },
        { days: 1000, title: "千日傳奇", desc: "連續登入滿 1000 天", icon: "fa-crown" },
        { days: 1500, title: "十五百鍊", desc: "連續登入滿 1500 天", icon: "fa-wand-magic-sparkles" },
        { days: 2000, title: "雙甲榮光", desc: "連續登入滿 2000 天", icon: "fa-chess-king" },
        { days: 3000, title: "三千寰宇", desc: "連續登入滿 3000 天", icon: "fa-globe" }
      ];

      const loginContainer = document.getElementById('login-badges-container');
      loginContainer.innerHTML = loginBadgesConfig.map(b => {
        const unlocked = loginDays >= b.days;
        return `
          <div class="achievement-badge ${unlocked ? '' : 'locked'}">
            <div class="badge-icon-box"><i class="fa-solid ${b.icon}"></i></div>
            <div class="badge-title">${b.title}</div>
            <div class="badge-desc">${b.desc}</div>
            <div style="font-size: 0.75rem; font-weight: 800; color: ${unlocked ? 'var(--duo-green)' : '#999'}; margin-top: auto;">
              ${unlocked ? '✅ 已解鎖' : `🔒 需登入 ${b.days} 天 (目前 ${loginDays} 天)`}
            </div>
          </div>
        `;
      }).join('');

      const perfectBadgesConfig = [
        { count: 1, title: "初試啼聲", desc: "首次 10 題全對", icon: "fa-star" },
        { count: 3, title: "滿分達人", desc: "累積達成 3 次全對", icon: "fa-award" },
        { count: 5, title: "卓越菁英", desc: "累積達成 5 次全對", icon: "fa-medal" },
        { count: 10, title: "百分之王", desc: "累積達成 10 次全對", icon: "fa-trophy" },
        { count: 50, title: "答題神手", desc: "累積達成 50 次全對", icon: "fa-bolt" },
        { count: 200, title: "無懈可擊", desc: "累積達成 200 次全對", icon: "fa-fire-flame-curved" },
        { count: 500, title: "全知學者", desc: "累積達成 500 次全對", icon: "fa-graduation-cap" },
        { count: 1000, title: "單字宗師", desc: "累積達成 1000 次全對", icon: "fa-hat-wizard" },
        { count: 3000, title: "三千精銳", desc: "累積達成 3000 次全對", icon: "fa-shield-heart" },
        { count: 5000, title: "至高無上", desc: "累積達成 5000 次全對", icon: "fa-gem" },
        { count: 10000, title: "獨孤求敗", desc: "累積達成 10000 次全對", icon: "fa-dragon" },
        { count: 50000, title: "傳說霸主", desc: "累積達成 50000 次全對", icon: "fa-phoenix-birds" }
      ];

      const perfectContainer = document.getElementById('perfect-badges-container');
      perfectContainer.innerHTML = perfectBadgesConfig.map(b => {
        const unlocked = perfectCount >= b.count;
        return `
          <div class="achievement-badge ${unlocked ? '' : 'locked'}">
            <div class="badge-icon-box"><i class="fa-solid ${b.icon}"></i></div>
            <div class="badge-title">${b.title}</div>
            <div class="badge-desc">${b.desc}</div>
            <div style="font-size: 0.75rem; font-weight: 800; color: ${unlocked ? 'var(--duo-green)' : '#999'}; margin-top: auto;">
              ${unlocked ? '✅ 已解鎖' : `🔒 需全對 ${b.count} 次 (目前 ${perfectCount} 次)`}
            </div>
          </div>
        `;
      }).join('');
    }

    function listenEnterpriseHistory() {
      const historyRef = ref(db, 'quiz_history');
      onValue(historyRef, (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('enterprise-history-tbody');
        if (!tbody) return;

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888;">尚無測驗紀錄</td></tr>`;
          return;
        }

        const historyArray = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);
        tbody.innerHTML = historyArray.slice(0, 20).map(h => `
          <tr>
            <td>${h.user}</td>
            <td>Level ${h.level || 1}</td>
            <td>${h.score}</td>
            <td style="color: var(--duo-green);">${h.pct}%</td>
            <td style="color: #888;">${h.date}</td>
          </tr>
        `).join('');
      });
    }

    window.renderDatabase = function() {
      const searchInput = document.getElementById('db-search-input');
      const query = (searchInput && searchInput.value ? searchInput.value : "").toLowerCase();
      const tbody = document.getElementById('db-tbody');
      if (!tbody) return;

      // 修正處：嚴格防範欄位為空或 null 導致 toLowerCase 報錯
      const filtered = masterVocabDB.filter(item => {
        const wordStr = (item.word || "").toLowerCase();
        const meaningStr = (item.meaning || "").toLowerCase();
        return wordStr.includes(query) || meaningStr.includes(query);
      }).slice(0, 50);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888;">沒有找到符合的單字</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <tr>
          <td style="color: var(--duo-blue); font-weight: bold;">${item.word || ''}</td>
          <td>${item.meaning || ''}</td>
          <td>L${item.level || 1}</td>
          <td style="font-size: 0.85rem; color: #666;">
            <div>${item.exampleEn || ''}</div>
            <div style="color: #888; margin-top: 2px;">${item.exampleZh || ''}</div>
          </td>
        </tr>
      `).join('');
    };
  </script>
</body>
</html>
