<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Vocab Pro - Duolingo 旗艦版</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --duo-green: #58cc02;
      --duo-green-shadow: #46a302;
      --duo-blue: #1cb0f6;
      --duo-blue-shadow: #1899d6;
      --duo-orange: #ff9600;
      --duo-orange-shadow: #e58600;
      --duo-yellow: #ffc800;
      --duo-red: #ff4b4b;
      --duo-red-shadow: #ea2b2b;
      --duo-gray: #e5e5e5;
      --duo-dark-gray: #afafaf;
      --text-dark: #4b4b4b;
      --bg-main: #f7f9fa;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Din Round', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* 頂部 Duolingo 遊戲化 Header */
    header {
      background: white;
      border-bottom: 2px solid var(--duo-gray);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.4rem; font-weight: 900; color: var(--duo-green); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
    
    /* 頂部 gamification 狀態欄 */
    .status-bar { display: flex; align-items: center; gap: 20px; font-weight: 800; font-size: 1.05rem; }
    .status-item { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.2s; }
    .status-item:hover { transform: scale(1.1); }
    .fire { color: var(--duo-orange); }
    .gem { color: var(--duo-blue); }
    .heart { color: var(--duo-red); }
    .xp { color: var(--duo-yellow); }

    main { max-width: 900px; width: 100%; margin: 24px auto; padding: 0 16px; flex: 1; }

    /* 遊戲選單頁籤 */
    .nav-tabs { display: flex; gap: 12px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
    .tab-btn {
      background: white;
      border: 2px solid var(--duo-gray);
      border-bottom: 5px solid var(--duo-dark-gray);
      color: #777;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }
    .tab-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    .tab-btn.active {
      background: var(--duo-blue);
      color: white;
      border-color: var(--duo-blue-shadow);
      box-shadow: 0 4px 0 var(--duo-blue-shadow);
    }

    .card { background: var(--card-bg); border: 2px solid var(--duo-gray); border-radius: 24px; padding: 32px; box-shadow: 0 8px 0 var(--duo-gray); margin-bottom: 24px; position: relative; }

    .view { display: none; }
    .view.active { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* 3D 遊戲按鈕 */
    .btn-3d {
      background: var(--duo-green);
      color: white;
      border: none;
      border-bottom: 5px solid var(--duo-green-shadow);
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }
    .btn-3d:hover { filter: brightness(1.05); }
    .btn-3d:active { transform: translateY(3px); border-bottom-width: 2px; }

    .btn-secondary-3d {
      background: white;
      color: var(--duo-blue);
      border: 2px solid var(--duo-gray);
      border-bottom: 5px solid var(--duo-dark-gray);
    }
    .btn-secondary-3d:hover { background: #f8fafc; }

    /* 進度條 */
    .progress-bar-wrap { width: 100%; height: 16px; background: var(--duo-gray); border-radius: 10px; overflow: hidden; margin: 16px 0; }
    .progress-bar-fill { height: 100%; background: var(--duo-green); width: 0%; transition: width 0.3s ease; border-radius: 10px; }

    /* 學習卡牌模式 */
    .hero-card-viewport {
      background: white;
      border: 3px solid var(--duo-gray);
      border-radius: 24px;
      padding: 36px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 10px 0 var(--duo-gray);
      transition: all 0.3s;
    }
    .hero-word-header { display: flex; justify-content: space-between; align-items: center; }
    .hero-word-title { font-size: 3.2rem; font-weight: 900; color: #3c3c3c; }
    .hero-word-meaning { font-size: 1.8rem; color: var(--duo-blue); font-weight: 800; margin-top: 8px; }
    
    .audio-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--duo-blue);
      color: white;
      border: none;
      border-bottom: 4px solid var(--duo-blue-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.1s;
    }
    .audio-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

    .hero-example-box {
      background: #f1f5f9;
      border-left: 6px solid var(--duo-yellow);
      padding: 20px;
      border-radius: 16px;
      margin-top: 24px;
    }

    /* 分頁 Dots */
    .dots-container { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
    .dot {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: white;
      border: 2px solid var(--duo-gray);
      border-bottom: 4px solid var(--duo-dark-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #888;
      cursor: pointer;
    }
    .dot.active { background: var(--duo-green); color: white; border-color: var(--duo-green-shadow); }

    /* 測驗區 */
    .quiz-word-display { font-size: 2.8rem; font-weight: 900; color: #3c3c3c; text-align: center; margin: 20px 0; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 20px; }
    
    .option-btn {
      background: white;
      border: 2px solid var(--duo-gray);
      border-bottom: 5px solid var(--duo-dark-gray);
      padding: 18px 24px;
      border-radius: 18px;
      color: #3c3c3c;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .option-btn:hover { background: #f7f9fa; border-color: var(--duo-blue); }
    .option-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    
    /* 正確與錯誤狀態 */
    .option-btn.correct { background: #d7ffb8 !important; border-color: var(--duo-green) !important; color: #2e7d32 !important; }
    .option-btn.wrong { background: #ffdfe0 !important; border-color: var(--duo-red) !important; color: #c62828 !important; }

    /* 答題完成底欄反饋 (Duolingo Footer Style) */
    .feedback-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .feedback-footer.show { transform: translateY(0); }
    .feedback-footer.correct-bg { background: #d7ffb8; border-top: 3px solid var(--duo-green); color: #2e7d32; }
    .feedback-footer.wrong-bg { background: #ffdfe0; border-top: 3px solid var(--duo-red); color: #c62828; }

    .input-field {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: 2px solid var(--duo-gray);
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      margin: 16px 0;
    }
    .input-field:focus { border-color: var(--duo-blue); }

    /* 表格 styles */
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 14px; border-bottom: 2px solid var(--duo-gray); text-align: left; font-weight: 700; }
    th { color: #888; background: #f8fafc; }
  </style>
</head>
<body>

  <!-- 頂部 Duo 遊戲狀態列 -->
  <header>
    <div class="logo"><i class="fa-solid fa-feather-pointed"></i> Enterprise Vocab Pro</div>
    <div class="status-bar">
      <div class="status-item fire" title="連續學習天數"><i class="fa-solid fa-fire"></i> <span id="streak-count">7</span></div>
      <div class="status-item gem" title="獲得寶石"><i class="fa-solid fa-gem"></i> <span id="gem-count">1,250</span></div>
      <div class="status-item xp" title="總經驗值"><i class="fa-solid fa-bolt"></i> <span id="xp-count">340 XP</span></div>
      <div class="status-item heart" title="剩餘體力"><i class="fa-solid fa-heart"></i> 5</div>
    </div>
  </header>

  <main>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('study')"><i class="fa-solid fa-book-open"></i> 卡牌學習</button>
      <button class="tab-btn" onclick="switchTab('quiz')"><i class="fa-solid fa-gamepad"></i> 闖關測驗</button>
      <button class="tab-btn" onclick="switchTab('enterprise')"><i class="fa-solid fa-trophy"></i> 戰情排行榜</button>
      <button class="tab-btn" onclick="switchTab('database')"><i class="fa-solid fa-list-check"></i> 單字總庫 (<span id="db-count-label">0</span>)</button>
    </div>

    <!-- 1. 卡牌學習區 -->
    <div id="view-study" class="view active">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
        <div>
          <h2 style="font-size: 1.4rem; font-weight: 900;">🎯 每日單字特訓 (抽取 10 字)</h2>
          <p style="color: #888; font-size: 0.95rem; font-weight: 700;">點擊喇叭發音，點擊卡牌切換下一張。</p>
        </div>
        <button class="btn-3d" onclick="loadStudyCards()"><i class="fa-solid fa-shuffle"></i> 換一批單字</button>
      </div>

      <div id="hero-card-container"></div>

      <div class="dots-container" id="pagination-dots"></div>

      <div style="display: flex; justify-content: space-between; margin-top: 16px;">
        <button class="btn-3d btn-secondary-3d" id="btn-prev-card" onclick="changeCardIndex(-1)"><i class="fa-solid fa-arrow-left"></i> 上一張</button>
        <button class="btn-3d btn-secondary-3d" id="btn-next-card" onclick="changeCardIndex(1)">下一張 <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- 2. 闖關測驗區 -->
    <div id="view-quiz" class="view">
      <div class="card">
        <!-- 開始畫面 -->
        <div id="quiz-start-screen" style="text-align: center; padding: 20px 0;">
          <div style="font-size: 4rem; color: var(--duo-green); margin-bottom: 16px;"><i class="fa-solid fa-circle-play"></i></div>
          <h2 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 8px;">準備好開始英文挑戰了嗎？</h2>
          <p style="color: #777; font-size: 1rem; font-weight: 700; margin-bottom: 16px;">輸入玩家暱稱開始關卡挑戰：</p>
          <div>
            <input type="text" id="quiz-username-input" class="input-field" placeholder="輸入暱稱" maxlength="20">
          </div>
          <button class="btn-3d" onclick="startQuiz()" style="font-size: 1.2rem; width: 80%; max-width: 300px;"><i class="fa-solid fa-rocket"></i> 開始測驗</button>
        </div>

        <!-- 題目畫面 -->
        <div id="quiz-question-screen" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: #888;">
            <span id="quiz-progress-text">題目 1 / 10</span>
            <span style="color: var(--duo-orange);" id="quiz-lvl-badge">Level 1</span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="quiz-progress-fill"></div>
          </div>

          <div style="display: flex; justify-content: center; align-items: center; gap: 12px;">
            <div class="quiz-word-display" id="quiz-word-el">Loading...</div>
            <button class="audio-btn" id="quiz-speak-btn" onclick="speakCurrentWord()"><i class="fa-solid fa-volume-high"></i></button>
          </div>

          <div class="options-grid" id="quiz-options-container"></div>
        </div>

        <!-- 結算畫面 -->
        <div id="quiz-result-screen" style="display: none; text-align: center; padding: 20px 0;">
          <div style="font-size: 5rem; color: var(--duo-yellow); margin-bottom: 16px;"><i class="fa-solid fa-crown"></i></div>
          <h2 style="font-size: 2rem; font-weight: 900; margin-bottom: 8px;">關卡完成！</h2>
          <p id="quiz-score-display" style="font-size: 1.3rem; font-weight: 800; color: #3c3c3c; margin-bottom: 12px;"></p>
          <p id="quiz-feedback-display" style="font-size: 1.1rem; color: var(--duo-blue); font-weight: 800; margin-bottom: 24px;"></p>
          <button class="btn-3d" onclick="resetQuiz()"><i class="fa-solid fa-rotate-right"></i> 再玩一次</button>
        </div>
      </div>
    </div>

    <!-- 3. 戰情排行榜 -->
    <div id="view-enterprise" class="view">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="font-size: 1.4rem; font-weight: 900;"><i class="fa-solid fa-medal" style="color: var(--duo-yellow);"></i> 學習戰情排行榜</h2>
          <select id="filter-user-select" onchange="renderEnterpriseHistory()" style="padding: 8px 16px; border-radius: 12px; font-weight: 800; border: 2px solid var(--duo-gray);">
            <option value="ALL">全體排行榜</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>玩家暱稱</th>
              <th>挑戰等級</th>
              <th>得分</th>
              <th>正確率</th>
              <th>時間</th>
            </tr>
          </thead>
          <tbody id="enterprise-history-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 4. 單字庫完整檢索 -->
    <div id="view-database" class="view">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
          <h3 style="font-size: 1.3rem; font-weight: 900;">📚 7000 單字庫檢索</h3>
          <input type="text" id="db-search-input" placeholder="搜尋英文或中文..." oninput="renderDatabase()" class="input-field" style="margin: 0; max-width: 240px;">
        </div>
        <div style="overflow-x: auto; max-height: 480px;">
          <table>
            <thead>
              <tr>
                <th>單字</th>
                <th>釋義</th>
                <th>等級</th>
                <th>例句</th>
              </tr>
            </thead>
            <tbody id="db-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部 Duolingo 答題反饋彈窗 -->
  <div class="feedback-footer" id="feedback-footer">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="font-size: 2.5rem;" id="feedback-icon"><i class="fa-solid fa-circle-check"></i></div>
      <div>
        <h3 id="feedback-title" style="font-size: 1.4rem; font-weight: 900;">太棒了！</h3>
        <p id="feedback-detail" style="font-size: 1rem; font-weight: 700;"></p>
      </div>
    </div>
    <button class="btn-3d" id="feedback-next-btn" onclick="nextQuizQuestion()">下一題</button>
  </div>

  <script>
    let masterVocabDB = [];
    let currentStudyPool = [];
    let currentCardIndex = 0;

    let appState = {
      level: parseInt(localStorage.getItem('ox_ind_level')) || 1,
      lastUser: localStorage.getItem('ox_ind_last_user') || '',
      history: JSON.parse(localStorage.getItem('ox_ind_history')) || []
    };

    // 語音朗讀
    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    async function initDatabase() {
      try {
        const response = await fetch('./vocab_7000.json');
        if (!response.ok) throw new Error("JSON file not found");
        const rawData = await response.json();
        masterVocabDB = rawData.map((item, index) => ({
          key: item.word + "_" + index,
          word: item.word,
          meaning: (item.pos ? `[${item.pos}] ` : '') + (item.translation || item.meaning || ''),
          level: item.level || 1,
          exampleEn: item.sentence || item.exampleEn || "",
          exampleZh: item.exampleZh || ""
        }));
      } catch (err) {
        masterVocabDB = [
          { word: "ability", meaning: "[n.] 能力、才能", level: 1, exampleEn: "She has the ability to lead.", exampleZh: "她具備領導能力。" },
          { word: "efficiency", meaning: "[n.] 效率、效能", level: 1, exampleEn: "Improve manufacturing efficiency.", exampleZh: "提升製造效率。" },
          { word: "precision", meaning: "[n.] 精密度", level: 2, exampleEn: "CNC machining requires precision.", exampleZh: "CNC 加工需要精密度。" }
        ];
      }

      document.getElementById('db-count-label').innerText = masterVocabDB.length;
      if (appState.lastUser) {
        document.getElementById('quiz-username-input').value = appState.lastUser;
      }

      loadStudyCards();
      renderDatabase();
      renderEnterpriseHistory();
    }

    function switchTab(tabId) {
      ['study', 'quiz', 'enterprise', 'database'].forEach((id, idx) => {
        document.getElementById(`view-${id}`).classList.toggle('active', id === tabId);
        document.querySelectorAll('.tab-btn')[idx].classList.toggle('active', id === tabId);
      });
      if (tabId === 'study') loadStudyCards();
      if (tabId === 'enterprise') renderEnterpriseHistory();
      if (tabId === 'database') renderDatabase();
    }

    function getRandomItems(arr, count) {
      return [...arr].sort(() => 0.5 - Math.random()).slice(0, count);
    }

    function loadStudyCards() {
      if (masterVocabDB.length === 0) return;
      const pool = masterVocabDB.filter(item => item.level === appState.level);
      const targetPool = pool.length >= 4 ? pool : masterVocabDB;
      currentStudyPool = getRandomItems(targetPool, Math.min(10, targetPool.length));
      currentCardIndex = 0;
      renderStudyCard();
    }

    function renderStudyCard() {
      if (currentStudyPool.length === 0) return;
      const item = currentStudyPool[currentCardIndex];
      const container = document.getElementById('hero-card-container');

      container.innerHTML = `
        <div class="hero-card-viewport">
          <div>
            <div class="hero-word-header">
              <span class="hero-word-title">${item.word}</span>
              <button class="audio-btn" onclick="speakWord('${item.word}')"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            <div class="hero-word-meaning">${item.meaning}</div>
          </div>
          <div class="hero-example-box">
            <div style="font-weight: 800; font-size: 1.1rem; color: #3c3c3c;">"${item.exampleEn || 'No example sentence.'}"</div>
            <div style="color: #777; font-weight: 700; margin-top: 4px;">"${item.exampleZh || '暫無例句中文'}"</div>
          </div>
        </div>
      `;

      const dotsContainer = document.getElementById('pagination-dots');
      dotsContainer.innerHTML = '';
      currentStudyPool.forEach((_, idx) => {
        dotsContainer.innerHTML += `
          <div class="dot ${idx === currentCardIndex ? 'active' : ''}" onclick="goToCard(${idx})">${idx + 1}</div>
        `;
      });
    }

    function changeCardIndex(delta) {
      const newIndex = currentCardIndex + delta;
      if (newIndex >= 0 && newIndex < currentStudyPool.length) {
        currentCardIndex = newIndex;
        renderStudyCard();
      }
    }

    function goToCard(index) {
      currentCardIndex = index;
      renderStudyCard();
    }

    /* 闖關測驗邏輯 */
    let quizQuestions = [];
    let currentQIdx = 0;
    let currentScore = 0;
    let currentQuizUser = "";

    function startQuiz() {
      const inputEl = document.getElementById('quiz-username-input');
      const username = inputEl.value.trim();
      if (!username) { alert("請輸入暱稱！"); return; }

      currentQuizUser = username;
      appState.lastUser = username;
      localStorage.setItem('ox_ind_last_user', username);

      const pool = masterVocabDB.filter(item => item.level === appState.level);
      const targetPool = pool.length >= 4 ? pool : masterVocabDB;
      quizQuestions = getRandomItems(targetPool, Math.min(10, targetPool.length));
      currentQIdx = 0;
      currentScore = 0;

      document.getElementById('quiz-start-screen').style.display = 'none';
      document.getElementById('quiz-result-screen').style.display = 'none';
      document.getElementById('quiz-question-screen').style.display = 'block';
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      if (currentQIdx >= quizQuestions.length) {
        finishQuiz();
        return;
      }

      const q = quizQuestions[currentQIdx];
      document.getElementById('quiz-progress-text').innerText = `題目 ${currentQIdx + 1} / ${quizQuestions.length}`;
      document.getElementById('quiz-progress-fill').style.width = `${((currentQIdx + 1) / quizQuestions.length) * 100}%`;
      document.getElementById('quiz-word-el').innerText = q.word;

      speakWord(q.word);

      const wrongPool = masterVocabDB.filter(item => item.word !== q.word);
      const wrongs = getRandomItems(wrongPool, 3);
      const options = getRandomItems([q, ...wrongs], 4);

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';
      options.forEach((opt, idx) => {
        container.innerHTML += `
          <button class="option-btn" onclick="checkAnswer(this, '${opt.meaning.replace(/'/g, "\\'")}', '${q.meaning.replace(/'/g, "\\'")}')">
            <span>(${idx + 1}) ${opt.meaning}</span>
            <i class="fa-regular fa-circle"></i>
          </button>
        `;
      });
    }

    function speakCurrentWord() {
      const q = quizQuestions[currentQIdx];
      if (q) speakWord(q.word);
    }

    function checkAnswer(btn, selected, correct) {
      const isCorrect = selected === correct;
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.style.pointerEvents = 'none');

      if (isCorrect) {
        btn.classList.add('correct');
        btn.querySelector('i').className = 'fa-solid fa-circle-check';
        currentScore++;
        showFeedback(true, "答對了！太厲害了！");
      } else {
        btn.classList.add('wrong');
        btn.querySelector('i').className = 'fa-solid fa-circle-xmark';
        showFeedback(false, `正確答案是：${correct}`);
      }
    }

    function showFeedback(isCorrect, text) {
      const footer = document.getElementById('feedback-footer');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');
      const detail = document.getElementById('feedback-detail');
      const btn = document.getElementById('feedback-next-btn');

      footer.className = `feedback-footer show ${isCorrect ? 'correct-bg' : 'wrong-bg'}`;
      icon.innerHTML = isCorrect ? `<i class="fa-solid fa-circle-check"></i>` : `<i class="fa-solid fa-circle-xmark"></i>`;
      title.innerText = isCorrect ? "非常好！" : "再接再厲！";
      detail.innerText = text;
      btn.style.background = isCorrect ? "var(--duo-green)" : "var(--duo-red)";
      btn.style.borderColor = isCorrect ? "var(--duo-green-shadow)" : "var(--duo-red-shadow)";
    }

    function nextQuizQuestion() {
      document.getElementById('feedback-footer').classList.remove('show');
      currentQIdx++;
      renderQuizQuestion();
    }

    function finishQuiz() {
      document.getElementById('quiz-question-screen').style.display = 'none';
      document.getElementById('quiz-result-screen').style.display = 'block';

      const totalQ = quizQuestions.length;
      const pct = Math.round((currentScore / totalQ) * 100);
      document.getElementById('quiz-score-display').innerText = `${currentQuizUser} 獲得得分：${currentScore} / ${totalQ} (${pct}%)`;

      // 增加經驗值
      const currentXP = parseInt(document.getElementById('xp-count').innerText) || 0;
      document.getElementById('xp-count').innerText = `${currentXP + (currentScore * 10)} XP`;

      appState.history.unshift({
        user: currentQuizUser,
        date: new Date().toLocaleTimeString(),
        score: `${currentScore}/${totalQ}`,
        pct: pct,
        level: appState.level
      });
      localStorage.setItem('ox_ind_history', JSON.stringify(appState.history));
      renderEnterpriseHistory();
    }

    function resetQuiz() {
      document.getElementById('quiz-result-screen').style.display = 'none';
      document.getElementById('quiz-start-screen').style.display = 'block';
    }

    function renderEnterpriseHistory() {
      const tbody = document.getElementById('enterprise-history-tbody');
      if (!tbody) return;
      tbody.innerHTML = appState.history.map(h => `
        <tr>
          <td>${h.user}</td>
          <td>Level ${h.level}</td>
          <td>${h.score}</td>
          <td style="color: var(--duo-green);">${h.pct}%</td>
          <td style="color: #888;">${h.date}</td>
        </tr>
      `).join('');
    }

    function renderDatabase() {
      const query = document.getElementById('db-search-input').value.toLowerCase();
      const tbody = document.getElementById('db-tbody');
      const filtered = masterVocabDB.filter(item => item.word.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query)).slice(0, 50);

      tbody.innerHTML = filtered.map(item => `
        <tr>
          <td style="color: var(--duo-blue);">${item.word}</td>
          <td>${item.meaning}</td>
          <td>L${item.level}</td>
          <td style="font-size: 0.85rem; color: #666;">${item.exampleEn}</td>
        </tr>
      `).join('');
    }

    initDatabase();
  </script>
</body>
</html>
